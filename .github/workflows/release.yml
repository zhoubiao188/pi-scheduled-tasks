name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and run checks without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  # Trusted Publishing: GitHub mints a short-lived OIDC token for npm.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs a recent npm (>= 11.5).
      - run: npm install -g npm@latest

      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)." >&2
            exit 1
          fi

      # `npm publish --dry-run` still refuses a version that is already on the
      # registry, so the manual run validates the tarball instead.
      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public
